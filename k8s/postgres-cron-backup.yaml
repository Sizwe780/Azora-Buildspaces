apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: buildspaces
spec:
  schedule: "0 2 * * *" # Run at 2 AM every day
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: pg-backup
            image: postgres:15-alpine
            command:
            - /bin/sh
            - -c
            - |
              echo "Starting database backup..."
              TIMESTAMP=$(date +%Y%m%d_%H%M%S)
              BACKUP_FILE="/backups/db_backup_$TIMESTAMP.sql.gz"
              pg_dump "$DATABASE_URL" | gzip > "$BACKUP_FILE"
              echo "Backup completed: $BACKUP_FILE"
              # Include script to push to S3 or remote storage here
              # e.g., aws s3 cp "$BACKUP_FILE" "s3://$AWS_S3_BUCKET/"
              # For demonstration, we simply clean up backups older than 7 days
              find /backups -name "*.sql.gz" -type f -mtime +7 -delete
            env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: buildspaces-secrets
                  key: database-url
            - name: AWS_S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: buildspaces-secrets
                  key: aws-s3-bucket
            volumeMounts:
            - name: backup-storage
              mountPath: /backups
          restartPolicy: OnFailure
          volumes:
          - name: backup-storage
            persistentVolumeClaim:
              claimName: postgres-backup-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backup-pvc
  namespace: buildspaces
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
