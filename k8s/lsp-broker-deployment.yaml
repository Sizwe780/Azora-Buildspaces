apiVersion: apps/v1
kind: Deployment
metadata:
  name: lsp-broker
  namespace: buildspaces
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lsp-broker
  template:
    metadata:
      labels:
        app: lsp-broker
    spec:
      containers:
      - name: lsp-broker
        image: buildspaces-lsp-broker:latest
        ports:
        - containerPort: 3001
        env:
        - name: LSP_PORT
          value: "3001"
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: lsp-broker
  namespace: buildspaces
spec:
  selector:
    app: lsp-broker
  ports:
  - port: 3001
    targetPort: 3001
